name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two releases never run at once, and a release in progress always finishes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forks have no trusted publisher, so only this repository releases.
    if: ${{ github.repository == 'uxfront-com/10xagents' }}
    permissions:
      # Push the `changeset-release/main` branch and the release tags.
      contents: write
      # Open and update the Version Packages pull request.
      pull-requests: write
      # Publish to npm through a trusted publisher, with no token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # With pending changesets, this opens or updates the Version Packages pull
      # request. When that pull request merges, there are none left, so it builds
      # and publishes every version that npm doesn't have yet.
      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
